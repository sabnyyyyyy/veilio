[package]
name = "veilio-service-escrow"
version = "0.1.0"
description = "VEILIO Multi-Chain Services Escrow Anchor Program for Solana Devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veilio_service_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
